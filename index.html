
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akash Location Share</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f5ff;padding:18px;color:#172033}
main{max-width:440px;margin:20px auto;background:white;padding:20px;border-radius:14px}
button,input{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border-radius:8px;font-size:16px}
button{background:#1769e0;color:white;border:0}
input{border:1px solid #aaa}
#status{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h2>📍 Akash Location Share</h2>
<p>लोकेशन केवल उस व्यक्ति की अनुमति से शेयर होगी जो अपना फोन इस्तेमाल कर रहा है।</p>

<h3>अपनी लोकेशन शेयर करें</h3>
<button id="create">शेयर कोड बनाएँ</button>
<p id="mycode"></p>
<button id="start" disabled>मेरी लोकेशन शेयर करें</button>
<button id="stop" disabled>शेयरिंग बंद करें</button>

<hr>
<h3>शेयर की गई लोकेशन देखें</h3>
<input id="code" placeholder="शेयर कोड यहाँ डालें">
<button id="view">लोकेशन देखें</button>
<p id="status">तैयार है।</p>
<a id="map" target="_blank" rel="noopener" hidden>Google Maps में खोलें</a>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBe2kzpYaL3TM3dEk23GaYSge1ul2uLyK8",
  authDomain: "akashlocation.firebaseapp.com",
  databaseURL: "https://akashlocation-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "akashlocation",
  storageBucket: "akashlocation.firebasestorage.app",
  messagingSenderId: "126743312827",
  appId: "1:126743312827:web:c529f6c7237eb6c17c2c9e",
  measurementId: "G-YTEDEPSS1K"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const el = id => document.getElementById(id);

let myCode = "";
let geoWatch = null;
let viewer = null;

function status(text) { el("status").textContent = text; }

auth.signInAnonymously()
  .then(() => status("Firebase से जुड़ गया।"))
  .catch(e => status("Firebase Login त्रुटि: " + e.message));

function generateCode() {
  const bytes = new Uint8Array(18);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => b.toString(16).padStart(2,"0")).join("");
}

el("create").onclick = async () => {
  try {
    if (!auth.currentUser) await auth.signInAnonymously();

    myCode = generateCode();
    await db.ref("shares/" + myCode).set({
      shareCode: myCode,
      ownerUid: auth.currentUser.uid,
      location: null
    });

    el("mycode").textContent = "तुम्हारा शेयर कोड: " + myCode;
    el("start").disabled = false;
    el("stop").disabled = false;
    status("कोड बन गया। अब लोकेशन शेयर बटन दबाओ।");
  } catch(e) {
    status("कोड नहीं बना: " + e.message);
  }
};

el("start").onclick = () => {
  if (!myCode) return status("पहले शेयर कोड बनाओ।");
  if (!navigator.geolocation) return status("ब्राउज़र लोकेशन सपोर्ट नहीं करता।");

  status("फोन की लोकेशन अनुमति माँगी जा रही है...");

  geoWatch = navigator.geolocation.watchPosition(async pos => {
    try {
      await db.ref("shares/" + myCode + "/location").set({
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        updatedAt: Date.now()
      });
      status("लोकेशन शेयर हो रही है। कोड भरोसेमंद व्यक्ति को दो।");
    } catch(e) {
      status("Firebase में सेव नहीं हुआ: " + e.message);
    }
  }, e => {
    status("लोकेशन नहीं मिली। फोन की Location चालू करके ब्राउज़र अनुमति दो।");
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
};

el("stop").onclick = async () => {
  if (geoWatch !== null) navigator.geolocation.clearWatch(geoWatch);
  geoWatch = null;
  try {
    if (myCode && auth.currentUser) {
      await db.ref("shares/" + myCode + "/location").remove();
    }
    status("लोकेशन शेयरिंग बंद कर दी गई।");
  } catch(e) {
    status("बंद करते समय त्रुटि: " + e.message);
  }
};

el("view").onclick = async () => {
  const code = el("code").value.trim();
  if (!/^[a-f0-9]{36}$/.test(code)) {
    return status("सही 36 अक्षरों वाला शेयर कोड डालो।");
  }

  try {
    if (!auth.currentUser) await auth.signInAnonymously();
    if (viewer) viewer.off();

    viewer = db.ref("shares/" + code);
    status("लोकेशन खोज रहे हैं...");

    viewer.on("value", snap => {
      if (!snap.exists()) {
        el("map").hidden = true;
        return status("कोड नहीं मिला या शेयर बंद है।");
      }

      const loc = snap.val().location;
      if (!loc) {
        el("map").hidden = true;
        return status("अभी लोकेशन शेयर नहीं हुई है।");
      }

      el("map").href = "https://www.google.com/maps?q=" +
        encodeURIComponent(loc.lat + "," + loc.lon);
      el("map").hidden = false;
      el("map").textContent = "Google Maps में लोकेशन खोलें";
      status("लोकेशन मिली। आखिरी अपडेट: " +
        new Date(loc.updatedAt).toLocaleString("hi-IN"));
    }, e => status("लोकेशन नहीं पढ़ पाए: " + e.message));
  } catch(e) {
    status("त्रुटि: " + e.message);
  }
};
</script>
</body>
</html>
