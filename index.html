
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akash Location Share</title>
</head>
<body>
  <h2>लोकेशन साझा करें</h2>
  <p>यह बटन दबाने पर आपकी लोकेशन प्राप्त होगी और उसे आपके चुने हुए व्यक्ति के साथ साझा किया जाएगा। आगे बढ़ने से पहले उसकी जानकारी पढ़ें और अपनी मर्जी से सहमति दें।</p>
  <button id="share">मेरी लोकेशन प्राप्त करें</button>
  <p id="result"></p>

  <script>
    const button = document.getElementById("share");
    const result = document.getElementById("result");

    button.onclick = () => {
      if (!navigator.geolocation) {
        result.textContent = "आपका ब्राउज़र लोकेशन की सुविधा नहीं देता।";
        return;
      }

      result.textContent = "लोकेशन प्राप्त की जा रही है…";

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          const map = `https://maps.google.com/?q=${lat},${lon}`;

          result.replaceChildren();
          const message = document.createElement("p");
          message.textContent = "आपकी लोकेशन मिली। इसे अपनी मर्जी से साझा करें:";
          const link = document.createElement("a");
          link.href = map;
          link.textContent = "Google Maps पर मेरी लोकेशन";
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          result.append(message, link);
        },
        () => {
          result.textContent = "लोकेशन नहीं मिली। अनुमति और फोन की लोकेशन सेटिंग जाँचें।";
        }
      );
    };
  </script>
</body>
</html>
