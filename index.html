<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akash Location Share</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 25px;
      background: #f2f5ff;
    }
    .box {
      background: white;
      padding: 22px;
      border-radius: 14px;
      max-width: 420px;
      margin: 30px auto;
    }
    button {
      padding: 14px 20px;
      background: #1769ff;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
    }
    a {
      display: block;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Akash Location Share</h2>
    <p>अपनी लोकेशन शेयर करने के लिए नीचे बटन दबाएँ।</p>
    <p>आपकी अनुमति के बिना लोकेशन प्राप्त नहीं होगी।</p>
    <button id="share">मेरी लोकेशन शेयर करें</button>
    <p id="result"></p>
  </div>

  <script>
    const button = document.getElementById("share");
    const result = document.getElementById("result");

    button.onclick = () => {
      if (!navigator.geolocation) {
        result.textContent = "आपका ब्राउज़र लोकेशन सपोर्ट नहीं करता।";
        return;
      }

      result.textContent = "लोकेशन प्राप्त की जा रही है...";

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;

          result.textContent = "लोकेशन मिल गई। इसे अपनी मर्जी से शेयर करें।";

          const link = document.createElement("a");
          link.href = mapUrl;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "Google Maps पर लोकेशन देखें";
          result.appendChild(link);

          const shareButton = document.createElement("button");
          shareButton.textContent = "लोकेशन लिंक शेयर करें";
          shareButton.style.marginTop = "15px";

          shareButton.onclick = async () => {
            try {
              if (navigator.share) {
                await navigator.share({
                  title: "मेरी लोकेशन",
                  url: mapUrl
                });
              } else if (navigator.clipboard) {
                await navigator.clipboard.writeText(mapUrl);
                result.append(" लिंक कॉपी हो गया।");
              } else {
                result.append(" ऊपर दिए गए Google Maps लिंक को खोलें।");
              }
            } catch (error) {
              result.append(" शेयर नहीं हो पाया। दोबारा कोशिश करें।");
            }
          };

          result.appendChild(shareButton);
        },
        () => {
          result.textContent = "लोकेशन नहीं मिली। फोन की Location चालू करें और अनुमति दें।";
        }
      );
    };
  </script>
</body>
</html>
